services:
  postgres:
    image: postgres:16-alpine
    container_name: coderoom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coderoom
      POSTGRES_PASSWORD: coderoom
      POSTGRES_DB: coderoom
    ports:
      - "5432:5432"
    volumes:
      - coderoom_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coderoom -d coderoom"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: coderoom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - coderoom_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  coderoom_pg:
  coderoom_redis:
